name: Build and push server image to GHCR

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "server/**"
      - "shared/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/matsumotodesuyo/7days-to-end-with-you:server
            ghcr.io/matsumotodesuyo/7days-to-end-with-you:server-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # build 完了後、my-server に「この SHA を deploy せよ」と伝える (ADR 0008 / DEPLOYMENT.md)。
  # GitHub App の短命トークンで my-server の deploy.yml を workflow_dispatch する。
  dispatch-deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Mint my-server deploy token (GitHub App)
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: MatsumotoDesuyo
          repositories: my-server

      - name: Trigger my-server deploy
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh workflow run deploy.yml \
            --repo MatsumotoDesuyo/my-server --ref main \
            -f service=7days-server \
            -f tag=server-${{ steps.sha.outputs.short }}
