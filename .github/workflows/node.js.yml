# モノレポ全体を本番ランタイムと同じ Node 22 で lint / build / test する。
# あわせて本番のイメージ (ルートの Dockerfile) を build して起動し、外から確かめる (job image-smoke、#49)。
# lock に新しく入る版の公開からの日数も確かめる (job release-age、#49)。
name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # 本番のイメージを build し、.github/scripts/image-smoke.sh で SPA・実辞書・health・graceful shutdown を確かめる (#49 段階 3a)。
  # job の id はルールセットの必須のチェックに名指すので変えない。test と並べて走らせ、needs・パスの絞り込み・if で飛ばさない
  # (前の job が落ちて skipped になると、必須のチェックで合格に数えられうるため)
  image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the production image and run the smoke test
        run: bash .github/scripts/image-smoke.sh

  # lock に新しく入る版が、公開から renovate.json の minimumReleaseAge 以上かを確かめる (#49。脆弱性の修正の branch は除く)。
  # Renovate が npm install --before を外した PR (Artifact update notice) が、待ちを経ずに自動 merge されないように。
  # job の id はルールセットの必須のチェックに名指すので変えない。needs・パスの絞り込み・if で飛ばさない。
  # registry に届かないと赤になる (安全な側)。外因なら re-run で直す。7 日に満たずに赤になった Renovate の PR は、lock が変わらないと
  # CI が回り直さない (赤が残って自動 merge が止まったまま) ので、7 日を過ぎた後に re-run で直す。どちらも門を緩めない
  release-age:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Self-test of the release-age script
        run: node --test .github/scripts/release-age.test.mjs
      - name: Check the release age of versions newly added to package-lock.json
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: node .github/scripts/release-age.mjs
