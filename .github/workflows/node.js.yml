# モノレポ全体を本番ランタイムと同じ Node 22 で lint / build / test する。
# あわせて本番のイメージ (ルートの Dockerfile) を build して起動し、外から確かめる (job image-smoke、#49)。
name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # 本番のイメージを build し、scripts/image-smoke.sh で SPA・実辞書・health・graceful shutdown を確かめる (#49 段階 3a)。
  # job の id はルールセットの必須のチェックに名指すので変えない。test と並べて走らせ、needs・パスの絞り込み・if で飛ばさない
  # (前の job が落ちて skipped になると、必須のチェックで合格に数えられうるため)
  image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the production image and run the smoke test
        run: bash scripts/image-smoke.sh

  # [使い捨て。merge しない] renovate.json を Renovate の validator で確かめる (#49 段階 3b。手元で Renovate を動かさない)
  tmp-renovate-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Install the validator (Renovate 44.125.1, the hosted version that created #61)
        run: npm install --no-save --prefix /tmp/rv renovate@44.125.1 >/dev/null && /tmp/rv/node_modules/.bin/renovate-config-validator --help | head -5 || true
      - name: Validate this branch's renovate.json (--strict)
        run: /tmp/rv/node_modules/.bin/renovate-config-validator --strict renovate.json
      - name: Validate main's renovate.json as the baseline (--strict)
        run: |
          git show HEAD^1:renovate.json > /tmp/main-renovate.json
          /tmp/rv/node_modules/.bin/renovate-config-validator --strict /tmp/main-renovate.json
      - name: A deliberately wrong config must be rejected
        run: |
          jq '(.packageRules[] | select(.groupName == "npm minor-and-patch") | .automergeSchedule) = ["after 9am and befor 9pm on saturday"]' renovate.json > /tmp/bad-schedule.json
          jq '(.packageRules[] | select(.groupName == "npm minor-and-patch")) += {"automergeShedule": ["after 9am on saturday"]}' renovate.json > /tmp/bad-key.json
          for f in /tmp/bad-schedule.json /tmp/bad-key.json; do
            if /tmp/rv/node_modules/.bin/renovate-config-validator --strict "$f"; then echo "NG: $f passed"; exit 1; else echo "OK: $f rejected"; fi
          done
