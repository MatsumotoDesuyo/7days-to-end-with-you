# モノレポ全体を本番ランタイムと同じ Node 22 で lint / build / test する。
# あわせて本番のイメージ (ルートの Dockerfile) を build して起動し、外から確かめる (job image-smoke、#49)。
name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # 本番のイメージを build し、scripts/image-smoke.sh で SPA・実辞書・health・graceful shutdown を確かめる (#49 段階 3a)。
  # job の id はルールセットの必須のチェックに名指すので変えない。test と並べて走らせ、needs・パスの絞り込み・if で飛ばさない
  # (前の job が落ちて skipped になると、必須のチェックで合格に数えられうるため)
  image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the production image and run the smoke test
        run: bash scripts/image-smoke.sh

  # [使い捨て。merge しない] renovate.json を Renovate の validator で確かめる (#49 段階 3b。手元で Renovate を動かさない)
  # 引数にファイルを渡すと global config として読まれるので、renovate.json のある directory で引数なしに動かす (repository config として読む)
  tmp-renovate-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install the validator (Renovate 44.125.1, the hosted version that created #61. engines node ^24.11.0)
        run: |
          node --version
          npm install --no-save --prefix /tmp/rv renovate@44.125.1 >/dev/null
          echo "renovate $(node -p "require('/tmp/rv/node_modules/renovate/package.json').version")"
      - name: Validate this branch's renovate.json as repository config (--strict)
        run: /tmp/rv/node_modules/.bin/renovate-config-validator --strict
      - name: Validate main's renovate.json as the baseline (--strict)
        run: |
          mkdir -p /tmp/main && git show HEAD^1:renovate.json > /tmp/main/renovate.json
          cd /tmp/main && /tmp/rv/node_modules/.bin/renovate-config-validator --strict
      - name: Deliberately wrong configs must be rejected (key typo, wrong type)
        run: |
          mkdir -p /tmp/bad-key /tmp/bad-type
          jq '(.packageRules[] | select(.groupName == "npm minor-and-patch")) += {"automergeShedule": ["after 9am on saturday"]}' renovate.json > /tmp/bad-key/renovate.json
          jq '(.packageRules[] | select(.groupName == "npm minor-and-patch") | .automerge) = "yes"' renovate.json > /tmp/bad-type/renovate.json
          rc=0
          for d in /tmp/bad-key /tmp/bad-type; do
            if (cd "$d" && /tmp/rv/node_modules/.bin/renovate-config-validator --strict); then echo "NG: $d passed"; rc=1; else echo "OK: $d rejected"; fi
          done
          exit $rc
      - name: The validator does not check automergeSchedule (record it)
        run: |
          mkdir -p /tmp/bad-schedule
          jq '(.packageRules[] | select(.groupName == "npm minor-and-patch") | .automergeSchedule) = ["sometime on blursday"]' renovate.json > /tmp/bad-schedule/renovate.json
          if (cd /tmp/bad-schedule && /tmp/rv/node_modules/.bin/renovate-config-validator --strict); then echo "NOTE: an invalid automergeSchedule passes the validator"; else echo "NOTE: the validator rejected an invalid automergeSchedule"; fi
      - name: Check the schedules with Renovate's own hasValidSchedule / isScheduledNow at fixed times (Asia/Tokyo)
        run: |
          ls /tmp/rv/node_modules/renovate/dist/workers/repository/update/branch/schedule.js
          cat > /tmp/rv/sched-check.mjs <<'JS'
          import { readFileSync } from 'node:fs';
          import { Settings } from 'luxon';
          const { hasValidSchedule, isScheduledNow } = await import('./node_modules/renovate/dist/workers/repository/update/branch/schedule.js');
          const cfg = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const rule = cfg.packageRules.find((r) => r.groupName === 'npm minor-and-patch');
          const tz = 'Asia/Tokyo';
          console.log('automergeSchedule', JSON.stringify(rule.automergeSchedule), 'hasValidSchedule', JSON.stringify(hasValidSchedule(rule.automergeSchedule)));
          console.log('schedule', JSON.stringify(cfg.schedule), 'hasValidSchedule', JSON.stringify(hasValidSchedule(cfg.schedule)));
          console.log('invalid sample', 'hasValidSchedule', JSON.stringify(hasValidSchedule(['sometime on blursday'])));
          let ok = hasValidSchedule(rule.automergeSchedule)[0] === true && hasValidSchedule(cfg.schedule)[0] === true;
          const check = (key, value, iso, want) => {
            Settings.now = () => Date.parse(iso);
            const got = isScheduledNow({ [key]: value, timezone: tz }, key);
            console.log(`${got === want ? 'OK' : 'NG'} ${key} ${iso} -> ${got} (want ${want})`);
            if (got !== want) ok = false;
          };
          for (const [iso, want] of [
            ['2026-10-10T08:59:00+09:00', false], ['2026-10-10T09:00:00+09:00', true], ['2026-10-10T13:00:00+09:00', true],
            ['2026-10-10T20:59:00+09:00', true], ['2026-10-10T21:00:00+09:00', false], ['2026-10-10T06:00:00+09:00', false],
            ['2026-10-09T13:00:00+09:00', false], ['2026-10-11T13:00:00+09:00', false],
          ]) check('automergeSchedule', rule.automergeSchedule, iso, want);
          for (const [iso, want] of [
            ['2026-10-10T06:59:00+09:00', true], ['2026-10-10T07:00:00+09:00', false], ['2026-10-09T23:00:00+09:00', false],
          ]) check('schedule', cfg.schedule, iso, want);
          process.exit(ok ? 0 : 1);
          JS
          cd /tmp/rv && node sched-check.mjs "$GITHUB_WORKSPACE/renovate.json"
